version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    groups:
      guzzle:
        patterns:
          - "guzzlehttp/*"
      dev-dependencies:
        dependency-type: development
